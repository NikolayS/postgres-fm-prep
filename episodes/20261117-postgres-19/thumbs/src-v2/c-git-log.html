<!doctype html><html><head><meta charset="utf-8"><title>C: Revert, Revert, Stamp 19.0</title><link rel="stylesheet" href="common.css"><script>if(location.search.includes("sq"))document.documentElement.classList.add("sqr"),document.addEventListener("DOMContentLoaded",()=>document.body.classList.add("sq"))</script><style>
/* C. "git log". Three log lines read as the headline: Revert, Revert, Stamp 19.0. ("Stamp 19.0." is the
   real subject of the PostgreSQL release commit.) No hashes: no invented numbers. */
body{background:#10141c;color:#e8ecf2;font-family:"JetBrains Mono",monospace}
.log{position:absolute;left:44px;top:14px;font-weight:800;font-size:86px;line-height:1.08;white-space:nowrap;letter-spacing:-.03em}
.log div{display:flex;align-items:center}
.g{color:#5b6679;margin-right:.45em}
.r{color:#ff4d42}.ok{color:#3ddc84}
.x{display:inline-block;height:.62em;background:#ff4d42;opacity:.3;margin-left:.3em;border-radius:6px}
.cur{display:inline-block;width:.55em;height:.95em;background:#3ddc84;margin-left:.2em}
.h{filter:drop-shadow(0 0 28px rgba(16,20,28,.9))}
.floor{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,#10141c 95%);z-index:1}
body.sq .mark{color:#e8ecf2}
body.sq .log{left:52px;top:150px;font-size:118px;line-height:1.14}
body.sq .x{display:none}
</style></head><body>
<div class="mark"><i></i>Postgres.FM</div>
<div class="log">
<div><span class="g">*</span><span class="r">Revert</span><span class="x" style="width:6.2em"></span></div>
<div><span class="g">*</span><span class="r">Revert</span><span class="x" style="width:4.1em"></span></div>

</div>
