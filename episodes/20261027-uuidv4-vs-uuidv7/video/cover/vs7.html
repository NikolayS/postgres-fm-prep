<!doctype html>
<html><head><meta charset="utf-8"><title>UUIDv4 vs UUIDv7 cover</title>
<link rel="stylesheet" href="base.css">
<style>
  /* two text levels only; nothing under 66 px font size (about 48 px cap height) */
  body { background: radial-gradient(1200px 700px at 20% 30%, #161b26 0%, var(--ink) 60%); }
  .status { position: absolute; left: 48px; top: 40px; }
  .l2 { display: flex; align-items: center; gap: 22px; font-family: var(--display); font-size: 92px; line-height: 0.9; color: var(--paper); letter-spacing: 0.01em; }
  .l2 .ok { color: var(--ok); display: flex; align-items: center; }
  .l2 .ok .check { width: 0.62em; height: 0.62em; margin-left: 16px; border-width: 0 0.18em 0.18em 0; }
  .l1 { margin-top: 8px; font-family: var(--display); font-size: 236px; line-height: 0.85; color: var(--amber); letter-spacing: -0.01em; text-shadow: 0 10px 0 rgba(0,0,0,0.5); }
  .l1 .q { color: var(--paper); }
  .mark { left: auto; right: 48px; top: 44px; bottom: auto; font-size: 66px; gap: 18px; }
  .mark .dot { width: 28px; height: 28px; box-shadow: 0 0 0 8px rgba(255,59,59,0.25); }
  .robot { right: 48px; top: 136px; width: 120px; z-index: 1; transform: rotate(4deg); }
  .robot img { width: 100%; }
  .v3 .host.kirk { right: 450px; width: 560px; bottom: -30px; }
  .v3 .host.nik { bottom: -30px; }   /* shoulder curve below the canvas: no gap between the hosts */
  .host.kirk img { width: 560px; }
  /* this episode: Nik is further from the camera than Kirk; scale him up so he stays the anchor */
  .v3 .host.nik { right: -40px; bottom: -70px; width: 760px; } .v3 .host.nik img { width: 760px; }
  .v3 .host.kirk { right: 470px; width: 600px; bottom: -40px; } .v3 .host.kirk img { width: 600px; }
  .l2 .vs { font-size: 0.6em; color: var(--mute); margin: 0 4px; align-self: flex-end; padding-bottom: 0.12em; }
  .l1 { display: flex; align-items: center; }
  .l1 .okc { color: var(--ok); display: inline-flex; align-items: center; margin-left: 0.02em; }
  .l1 .okc .check { width: 0.3em; height: 0.3em; margin-left: 0; border-width: 0 0.09em 0.09em 0; transform: rotate(45deg) translate(-0.02em,-0.02em); }
  /* balance (Nik 2026-10-30): equal head height and eye level; Kirk 1.625x of his 400 px crop, Nik 1.4x of his 470 px crop */
  .v3 .host.kirk { right: 395px; bottom: -62px; width: 650px; } .v3 .host.kirk img { width: 650px; -webkit-mask-image: linear-gradient(to right, #000 82%, transparent 100%); mask-image: linear-gradient(to right, #000 82%, transparent 100%); }
  .v3 .host.nik { right: -85px; bottom: -57px; width: 658px; } .v3 .host.nik img { width: 658px; }
</style></head>
<body><div class="canvas v3">
  <div class="status">
    <div class="l2">UUIDv4 <span class="vs">vs</span></div>
    <div class="l1">UUIDv7<span class="okc"><span class="check"></span></span></div>
  </div>
  <div class="mark"><span class="dot"></span>Postgres.FM</div>
  <div class="tile robot"><img src="img/samograph.png"></div>
  <div class="host kirk fade"><img src="img/kirk.png"></div>
  <div class="host nik"><img src="img/nik.png"></div>
  <div class="grain"></div>
</div></body></html>
