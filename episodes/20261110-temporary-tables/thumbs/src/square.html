<!doctype html>
<html><head><meta charset="utf-8"><title>Temp tables square</title>
<link rel="stylesheet" href="../../../../tools/podcast-edit/cover/base.css">
<style>
  body { width: 1000px; height: 1000px; background: radial-gradient(900px 700px at 25% 25%, #161b26 0%, var(--ink) 65%); }
  .mark { left: 56px; top: 52px; bottom: auto; font-size: 60px; gap: 16px; }
  .mark .dot { width: 26px; height: 26px; box-shadow: 0 0 0 8px rgba(255,59,59,0.25); }
  .status { position: absolute; left: 56px; top: 150px; }
  .l2 { display: flex; align-items: flex-end; gap: 22px; font-family: var(--display); font-size: 150px; line-height: 0.9; text-transform: uppercase; color: var(--paper); }
  .l2 .or { font-size: 0.6em; color: var(--mute); text-transform: none; padding-bottom: 0.06em; }
  .l1 { margin-top: 12px; font-family: var(--display); font-size: 175px; line-height: 0.88; color: var(--amber); text-transform: uppercase; letter-spacing: -0.01em; text-shadow: 0 12px 0 rgba(0,0,0,0.5); }
  .l1 .q { color: var(--paper); }
  .robot { right: 56px; top: 56px; width: 150px; transform: rotate(4deg); z-index: 1; }
  .hosts { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; z-index: 3; }
</style></head>
<body><div class="canvas">
  <div class="mark"><span class="dot"></span>Postgres.FM</div>
  <div class="status">
    <div class="l2">Temp tables</div>
    <div class="l1">23x<span class="q"> slower?</span></div>
  </div>
  <div class="tile robot"><img src="samograph.png"></div>
  <img class="hosts" src="hosts-sq.png">
  <div class="grain"></div>
</div></body></html>
